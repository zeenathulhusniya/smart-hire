spring.application.name=smart-hire-backend
server.port=${PORT:8080}

# JPA & Hibernate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# File Upload Security Limits (5 MB PDF)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# JWT & Gemini (Injected strictly via Environment Variables)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.gemini.api-key=${GEMINI_API_KEY}
app.gemini.model=${GEMINI_MODEL:gemini-4-hydrogen}

# CORS Origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
